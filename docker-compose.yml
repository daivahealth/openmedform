services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmedform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-openmedform}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmedform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # The image no longer migrates on boot — Cloud Run does it once per deploy
    # as a separate job. A self-hosted stack has no such deploy step, so the
    # old migrate-then-serve behaviour is kept here explicitly. Without it a
    # fresh `docker compose up` would start the API against an empty schema.
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/src/main.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmedform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openmedform}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 3100
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY is required (openssl rand -hex 32)}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-}
      AI_CLAUDE_API_KEY: ${AI_CLAUDE_API_KEY:-}
      AI_CLAUDE_MODEL: ${AI_CLAUDE_MODEL:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-}
      AI_MINIMAX_API_KEY: ${AI_MINIMAX_API_KEY:-}
      AI_MINIMAX_MODEL: ${AI_MINIMAX_MODEL:-}
      AI_KIMI_API_KEY: ${AI_KIMI_API_KEY:-}
      AI_KIMI_MODEL: ${AI_KIMI_MODEL:-}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-}
      AI_OLLAMA_MODEL: ${AI_OLLAMA_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # API clients already include the /api prefix in their request paths.
        # Keep this at the gateway origin to avoid /api/api/forms requests.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@openmedform.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "${PGADMIN_PORT:-5050}:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  pgadmin_data:
