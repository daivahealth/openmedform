name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # API tests import services that pull in @prisma/client, which needs the
      # generated client (CI runners start from a clean checkout).
      - name: Generate Prisma client
        run: pnpm --filter @openmedform/api exec prisma generate

      # Only the publishable packages are built here; apps and demos are not
      # part of the release set.
      - name: Build packages
        run: pnpm build:packages

      - name: Test
        run: pnpm test

      # deploy.yml only runs after merge, so a malformed secrets entry takes
      # production's deploy down rather than failing a PR. Check it here.
      - name: Validate deploy workflow
        run: node scripts/check-deploy-workflow.mjs

      # release.yml has the same after-merge-only problem. This reads the
      # changeset files rather than shelling out to `changeset status`, which
      # diffs against main and needs git history the shallow clone lacks.
      - name: Validate changesets
        run: node scripts/check-changesets.mjs

      # The production-dependency audit is NOT a merge gate any more. It went
      # red three times in one day with no code change, because advisories
      # are published against whatever the registry says today. It now runs
      # nightly in audit.yml, which opens a fix PR (scoped overrides) that
      # comes back through this workflow like any other change.
