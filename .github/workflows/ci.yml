name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # API tests import services that pull in @prisma/client, which needs the
      # generated client (CI runners start from a clean checkout).
      - name: Generate Prisma client
        run: pnpm --filter @openmedform/api exec prisma generate

      # Only the publishable packages are built here; apps and demos are not
      # part of the release set.
      - name: Build packages
        run: pnpm build:packages

      - name: Test
        run: pnpm test
