name: Deploy

# Builds and deploys the API and Web images to Cloud Run on every push to
# main. Auth is keyless via Workload Identity Federation (no JSON keys).
# One-time GCP setup: scripts/gcp-setup.sh (see docs/deployment/GCP-CLOUD-RUN.md).
# Kept separate from release.yml, which only publishes npm packages.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# Required GitHub Actions variables (Settings > Secrets and variables > Actions):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_SERVICE_ACCOUNT, API_URL (https://api.<domain>), WEB_URL (https://app.<domain>)
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: openmedform
  API_SERVICE: openmedform-api
  WEB_SERVICE: openmedform-web
  IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/openmedform

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile \
            -t ${{ env.IMAGE_BASE }}/api:${{ github.sha }} \
            -t ${{ env.IMAGE_BASE }}/api:latest .
          docker push ${{ env.IMAGE_BASE }}/api:${{ github.sha }}
          docker push ${{ env.IMAGE_BASE }}/api:latest

      - name: Build and push Web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.API_URL }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }} \
            -t ${{ env.IMAGE_BASE }}/web:${{ github.sha }} \
            -t ${{ env.IMAGE_BASE }}/web:latest .
          docker push ${{ env.IMAGE_BASE }}/web:${{ github.sha }}
          docker push ${{ env.IMAGE_BASE }}/web:latest

      # Migrations run here, once per deploy, rather than in the container's
      # CMD on every cold start. Two reasons:
      #
      # 1. Correctness. --max-instances=4 means several containers can boot at
      #    once on a scale-up and race the same migration. Prisma's advisory
      #    lock makes that safe but serial: each instance waits its turn before
      #    it can serve. Once per deploy has no race to lose.
      # 2. Latency. Resolving the Prisma CLI, connecting to the database,
      #    taking the lock and reading _prisma_migrations all happened *before*
      #    the server bound its port, so every cold start paid for it.
      #
      # A Cloud Run Job rather than a step on this runner because it needs no
      # new IAM: the deploy SA already has roles/run.admin, and the job runs as
      # the runtime SA, which already holds secretAccessor on DATABASE_URL. It
      # also runs the exact image being deployed, so the schema and the client
      # that will serve it are guaranteed to come from the same build.
      #
      # --args uses gcloud's escaped-list syntax (^DELIM^a DELIM b) because the
      # default separator is a comma and the argument contains spaces.
      #
      # A failure here fails the workflow before the new revision rolls out,
      # which is the right order: previously a bad migration shipped first and
      # then crash-looped the service.
      - name: Run database migrations
        run: |
          gcloud run jobs deploy openmedform-migrate \
            --image ${{ env.IMAGE_BASE }}/api:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account openmedform-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-secrets DATABASE_URL=DATABASE_URL:latest \
            --command sh \
            --args '^|^-c|npx prisma migrate deploy' \
            --max-retries 0 \
            --task-timeout 10m \
            --execute-now \
            --wait \
            --quiet

      # Secrets are sourced from Secret Manager (created by scripts/gcp-setup.sh);
      # update their values there — never in this file.
      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_BASE }}/api:${{ github.sha }}
          service_account: openmedform-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          # --no-cpu-throttling is REQUIRED, not a tuning knob. Conversion runs
          # fire-and-forget after the HTTP response is sent, and Cloud Run's
          # default throttles an instance's CPU to near zero once a request
          # completes. LLM calls survive that because they are network-bound;
          # anything CPU-bound does not. Launching Chromium to render a
          # script-built HTML mock-up is CPU-bound, so under the default it
          # cannot finish inside its timeout and the upload is rejected.
          # 1Gi gives Node + Chromium headroom (512Mi is enough to render but
          # leaves nothing spare alongside a large LLM payload).
          #
          # --max-instances bounds the rate limiter. The throttler's storage is
          # in-memory and therefore per-instance, so the effective limit is
          # (configured limit x running instances). Unbounded autoscaling would
          # make the limits meaningless; capping instances makes the multiple
          # known. A strict global limit needs shared storage or Cloud Armor —
          # see docs/security/AUTH-AND-RBAC.md.
          #
          # --min-instances=1 keeps one container warm. Sign-in is the reason:
          # it is a full-page redirect to this service, so a user who had not
          # signed in recently waited out a cold start — image pull plus Nest
          # boot — while looking at a page that could not tell them anything
          # was happening. Warm, the same path is 100-200ms end to end.
          #
          # This is a deliberate cost: combined with --no-cpu-throttling, one
          # instance is now billed continuously rather than only while serving.
          # Web is intentionally left scaling to zero — it is a much lighter
          # image and is already warm by the time the SSO callback lands.
          flags: --memory=1Gi --no-cpu-throttling --max-instances=4 --min-instances=1
          env_vars: |
            TRUST_PROXY_HOPS=1
          # Every secret listed below must exist in Secret Manager or the deploy
          # fails outright — including the ones for a provider you have not set
          # up yet. scripts/gcp-setup.sh creates them all with a CHANGE_ME
          # placeholder, which the handshake guard reads as "unconfigured" and
          # answers with a 503. So an unused provider costs a placeholder
          # secret, not a broken deploy.
          #
          # This has to stay OUTSIDE the block below: `secrets:` is a literal
          # string the action splits into KEY=SECRET:VERSION lines, so a `#`
          # inside it is not a comment — it becomes a bogus secret name and the
          # deploy dies on it.
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            AI_ENCRYPTION_KEY=AI_ENCRYPTION_KEY:latest
            FRONTEND_ORIGIN=FRONTEND_ORIGIN:latest
            GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
            GOOGLE_CALLBACK_URL=GOOGLE_CALLBACK_URL:latest
            MICROSOFT_CLIENT_ID=MICROSOFT_CLIENT_ID:latest
            MICROSOFT_CLIENT_SECRET=MICROSOFT_CLIENT_SECRET:latest
            MICROSOFT_CALLBACK_URL=MICROSOFT_CALLBACK_URL:latest

      - name: Deploy Web to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_BASE }}/web:${{ github.sha }}
