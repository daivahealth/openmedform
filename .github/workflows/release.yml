name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the "Version Packages" PR / tags
      pull-requests: write # open the version PR
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT so the changesets "Version Packages" PR can be created:
          # the default GITHUB_TOKEN is blocked from opening PRs when the org/repo
          # policy "Allow GitHub Actions to create and approve pull requests" is
          # off. Falls back to GITHUB_TOKEN if the PAT secret isn't set.
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # On a normal push this opens/updates a "Version Packages" PR from the
      # pending changesets. When that PR is merged, this runs again and the
      # `publish` step publishes the bumped packages to npm.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # PAT (Contents: write + Pull requests: write) so the action can open
          # the "Version Packages" PR; falls back to the default token, which
          # only works if the repo/org allows Actions to create PRs.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
